name: 出了问题 / Something is broken
description: 报告一个错误 / Report a bug
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 你做了什么、看到了什么、本来想看到什么。截图很有帮助。 / What you did, what you saw, what you expected. Screenshots help.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备和浏览器 / Device and browser
      placeholder: iPhone · Safari / Windows · Chrome …
